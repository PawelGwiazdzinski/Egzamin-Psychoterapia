name: Lektor – Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK Androida (preinstalowane na maszynie GitHuba)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || echo "::warning::sdkmanager install nieudany – Gradle spróbuje pobrać sam"

      - name: Zależności JS
        run: npm ci

      - name: Kopiowanie aplikacji do projektu Androida
        run: |
          npm run sync
          # kontrola: rdzeń Capacitora musi być dołączony, inaczej aplikacja nie wystartuje
          test -f android/app/src/main/assets/public/vendor/capacitor.js
          grep -q 'vendor/capacitor.js' android/app/src/main/assets/public/index.html

      - name: Klucz podpisu z sekretu
        env:
          KS: ${{ secrets.LEKTOR_KEYSTORE_B64 }}
          LEKTOR_KEYSTORE_PASSWORD: ${{ secrets.LEKTOR_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Brak sekretu LEKTOR_KEYSTORE_B64 – APK podpisany kluczem tymczasowym (logowanie Google nie zadziała)."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KS" | tr -d ' \r\n' | base64 -d > android/keystore/lektor.jks || true
          SIZE=$(stat -c %s android/keystore/lektor.jks)
          SUM=$(sha256sum android/keystore/lektor.jks | cut -c1-12)
          echo "Klucz z sekretu: ${#KS} znaków base64 -> $SIZE bajtów, sha256 $SUM…"
          if ! keytool -list -keystore android/keystore/lektor.jks -storepass "$LEKTOR_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::warning::Klucz z sekretów jest uszkodzony albo hasło się nie zgadza (${#KS} znaków base64, $SIZE bajtów). APK podpisany kluczem tymczasowym – popraw sekrety LEKTOR_KEYSTORE_B64 / LEKTOR_KEYSTORE_PASSWORD."
            rm -f android/keystore/lektor.jks
          fi

      - name: Budowanie APK
        env:
          LEKTOR_KEYSTORE_PASSWORD: ${{ secrets.LEKTOR_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Lektor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lektor-apk
          path: android-app/Lektor.apk

      - name: Wydanie (link do pobrania na telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lektor-${{ github.run_number }}
          name: Lektor ${{ github.run_number }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Pobierz **Lektor.apk** na telefonie i otwórz plik, żeby zainstalować.
            Gałąź: ${{ github.ref_name }}
          files: android-app/Lektor.apk
